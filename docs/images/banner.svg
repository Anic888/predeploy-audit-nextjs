<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="predeploy-audit — a tiny, fast, low-noise security audit for indie Next.js apps">
  <defs>
    <linearGradient id="paBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="critAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="paGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#paBg)"/>
  <rect width="1200" height="320" fill="url(#paGrid)"/>
  <rect y="316" width="1200" height="4" fill="url(#critAccent)"/>

  <!-- 9-check grid (left) -->
  <g transform="translate(80,82)">
    <text x="0" y="-12" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#525252" letter-spacing="2">9 CHECKS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">
      <!-- Row 1: C1-C5 critical -->
      <g>
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C1</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">.env git</text>
      </g>
      <g transform="translate(52,0)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C2</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">history</text>
      </g>
      <g transform="translate(104,0)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C3</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">api keys</text>
      </g>
      <g transform="translate(156,0)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C4</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">PUBLIC_*</text>
      </g>
      <g transform="translate(208,0)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C5</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">srv-role</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0,52)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C6</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">stripe</text>
      </g>
      <g transform="translate(52,52)">
        <rect width="44" height="44" rx="4" fill="#7f1d1d"/>
        <text x="22" y="20" text-anchor="middle" fill="#fecaca">C7</text>
        <text x="22" y="36" text-anchor="middle" fill="#fca5a5" font-size="7">RLS off</text>
      </g>
      <g transform="translate(104,52)">
        <rect width="44" height="44" rx="4" fill="#1e3a8a"/>
        <text x="22" y="20" text-anchor="middle" fill="#bfdbfe">C8</text>
        <text x="22" y="36" text-anchor="middle" fill="#93c5fd" font-size="7">next CVE</text>
      </g>
      <g transform="translate(156,52)">
        <rect width="44" height="44" rx="4" fill="#7c2d12"/>
        <text x="22" y="20" text-anchor="middle" fill="#fed7aa">C9</text>
        <text x="22" y="36" text-anchor="middle" fill="#fdba74" font-size="7">img **</text>
      </g>
      <!-- ms time -->
      <g transform="translate(216,52)">
        <rect width="44" height="44" rx="4" fill="#064e3b"/>
        <text x="22" y="20" text-anchor="middle" fill="#bbf7d0">80ms</text>
        <text x="22" y="36" text-anchor="middle" fill="#6ee7b7" font-size="7">total</text>
      </g>
    </g>
  </g>

  <!-- Terminal showing scan output (right) -->
  <g transform="translate(420,72)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="700" height="180" rx="10" fill="#0a0a0a" stroke="#262626"/>
    <rect width="700" height="28" rx="10" fill="#171717"/>
    <rect y="18" width="700" height="10" fill="#171717"/>
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="32" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="14" r="4" fill="#10b981"/>
    <text x="350" y="18" text-anchor="middle" font-size="10" fill="#737373">~/wobblr — predeploy-audit</text>

    <g font-size="12">
      <text x="14" y="54"><tspan fill="#06b6d4">$</tspan><tspan fill="#e5e7eb"> node predeploy-audit.mjs .</tspan></text>
      <text x="14" y="76"><tspan fill="#a3e635">✓</tspan><tspan fill="#94a3b8"> scanned 412 files in 78 ms</tspan></text>
      <text x="14" y="94"><tspan fill="#ef4444">✗ C1</tspan><tspan fill="#fecaca"> CRITICAL · .env.local tracked in git</tspan></text>
      <text x="14" y="112"><tspan fill="#ef4444">✗ C3</tspan><tspan fill="#fecaca"> CRITICAL · OpenAI key in src/lib/ai.ts:18</tspan></text>
      <text x="14" y="130"><tspan fill="#ef4444">✗ C7</tspan><tspan fill="#fecaca"> CRITICAL · users table has no RLS</tspan></text>
      <text x="14" y="148"><tspan fill="#f59e0b">⚠ C9</tspan><tspan fill="#fdba74"> HIGH · remotePatterns wildcard ** in next.config.js</tspan></text>
      <text x="14" y="170"><tspan fill="#06b6d4">$</tspan><tspan fill="#e5e7eb"> ▌</tspan></text>
    </g>
  </g>

  <!-- Typography overlap -->
  <g transform="translate(420,266)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="0" y="0" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-1">predeploy-audit</text>
    <text x="270" y="0" font-size="14" font-weight="500" fill="#737373">9 checks · ~80ms · zero deps · vibe-coded Next.js</text>
  </g>
</svg>
